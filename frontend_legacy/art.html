<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AegisPath — UI-Art & Design Tokens Showcase</title>
  <link rel="stylesheet" href="../../packages/design-tokens/index.css">
  <style>
    body {
      margin: 0;
      font-family: var(--font-ui, system-ui, sans-serif);
      background: var(--mist, #F2F5F3);
      color: var(--ink, #14213D);
      padding: 24px;
    }
    .art-container {
      max-width: 1040px;
      margin: 0 auto;
      background: #FFFFFF;
      border-radius: var(--radius-card, 16px);
      box-shadow: var(--shadow-card, 0 4px 20px rgba(0,0,0,0.06));
      padding: 32px;
      border: 1px solid var(--line, #E5E7EB);
    }
    .art-header {
      border-bottom: 1px solid var(--line, #E5E7EB);
      padding-bottom: 20px;
      margin-bottom: 28px;
    }
    .art-title {
      font-size: 26px;
      font-weight: 700;
      color: var(--blue-deep, #1F3FA8);
      margin: 0 0 6px 0;
    }
    .art-subtitle {
      font-size: 14px;
      color: var(--slate, #5B6B8C);
      margin: 0;
    }
    .section-title {
      font-size: 18px;
      font-weight: 700;
      margin: 32px 0 16px 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .section-accent {
      width: 4px;
      height: 18px;
      background: var(--blue, #3D6BEA);
      border-radius: 2px;
    }
    .chop-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 18px;
    }
    .chop-card {
      background: var(--mist, #F2F5F3);
      border: 1px solid var(--line, #E5E7EB);
      border-radius: var(--radius-tile, 12px);
      padding: 18px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .chop-card.blue-bg {
      background: var(--blue, #3D6BEA);
      color: #FFFFFF;
      border: none;
    }
    .chop-label {
      font-size: 13px;
      font-weight: 600;
    }
    .radial-preview-box {
      background: var(--night, #0A1440);
      border-radius: var(--radius-card, 16px);
      padding: 20px;
      text-align: center;
    }
    .badge-pill {
      display: inline-block;
      padding: 4px 10px;
      border-radius: var(--radius-pill, 999px);
      font-size: 11px;
      font-weight: 700;
      background: var(--sky, #DCE8FD);
      color: var(--blue, #3D6BEA);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="art-container">
    <header class="art-header">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div>
          <h1 class="art-title">AegisPath UI-Art & Design Tokens Showcase</h1>
          <p class="art-subtitle">Route: <code>/dev/art</code> · Verified SVG Assets from Appendix A</p>
        </div>
        <div style="display: flex; gap: 10px; align-items: center;">
          <a href="./index.html" class="badge-pill">← Back to Web App</a>
          <span class="badge-pill" style="background: var(--teal-soft, #D1F2EB); color: var(--teal, #0E6B5E);">Phase W1 Verified</span>
        </div>
      </div>
    </header>

    <!-- 1. Mascot Chop Across Expressions -->
    <div class="section-title">
      <span class="section-accent"></span>
      <span>Mascot "Chop" Expressions (Original Seal Vector)</span>
    </div>
    <div class="chop-grid" id="chop-gallery"></div>

    <!-- 2. Student Banner Doodle -->
    <div class="section-title">
      <span class="section-accent"></span>
      <span>Student Paper-Plane Doodle (Home Banner)</span>
    </div>
    <div style="background: var(--sky, #DCE8FD); padding: 24px; border-radius: var(--radius-card, 16px); display: flex; justify-content: center;" id="doodle-container"></div>

    <!-- 3. Radial Attack Map -->
    <div class="section-title">
      <span class="section-accent"></span>
      <span>Three-Ring Radial Attack Map (Night Mode with Pulse Simulation)</span>
    </div>
    <div class="radial-preview-box" id="radial-container"></div>
  </div>

  <script>
    // Load Art Module
    const uiArt = {
      renderChopMascot: ({ bodyColor = "#FFFFFF", faceColor = "#DCE8FD", expression = "idle", size = 64, showShield = false } = {}) => {
        let armSvg = "";
        let faceFeaturesSvg = "";
        let badgeSvg = "";
        let shieldSvg = "";

        if (expression === "wave") {
          armSvg = `<path d="M54 44 Q68 38 64 22" stroke="${bodyColor}" stroke-width="8" stroke-linecap="round" fill="none"/>`;
          faceFeaturesSvg = `
            <circle cx="22" cy="36" r="3.6" fill="#14213D"/>
            <circle cx="38" cy="36" r="3.6" fill="#14213D"/>
            <path d="M21 44 Q30 53 39 44" stroke="#14213D" stroke-width="2.2" stroke-linecap="round" fill="none"/>
          `;
        } else if (expression === "guard") {
          faceFeaturesSvg = `
            <circle cx="22" cy="36" r="3.4" fill="#14213D"/>
            <circle cx="38" cy="36" r="3.4" fill="#14213D"/>
            <path d="M14 29 L26 32 M46 29 L34 32" stroke="#14213D" stroke-width="2.4" stroke-linecap="round"/>
            <path d="M24 46 H36" stroke="#14213D" stroke-width="2.4" stroke-linecap="round"/>
          `;
          if (showShield) {
            shieldSvg = `<path d="M10 14 Q30 8 50 14 Q52 46 30 64 Q8 46 10 14 Z" fill="none" stroke="#3D6BEA" stroke-dasharray="3 3" stroke-width="2"/>`;
          }
        } else if (expression === "block") {
          faceFeaturesSvg = `
            <path d="M17 33 L27 38 M43 33 L33 38" stroke="#14213D" stroke-width="2.6" stroke-linecap="round"/>
            <path d="M24 47 H36" stroke="#14213D" stroke-width="2.4" stroke-linecap="round"/>
          `;
          badgeSvg = `
            <circle cx="56" cy="12" r="9" fill="#E5484D"/>
            <path d="M52 8 L60 16 M60 8 L52 16" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
          `;
        } else if (expression === "paused") {
          faceFeaturesSvg = `
            <path d="M18 36 Q22 40 26 36 M34 36 Q38 40 42 36" stroke="#14213D" stroke-width="2.2" stroke-linecap="round" fill="none"/>
          `;
          badgeSvg = `
            <circle cx="56" cy="12" r="9" fill="#5B6B8C"/>
            <path d="M53 8.5 V15.5 M59 8.5 V15.5" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
          `;
        } else {
          faceFeaturesSvg = `
            <circle cx="22" cy="36" r="3.6" fill="#14213D"/>
            <circle cx="38" cy="36" r="3.6" fill="#14213D"/>
            <path d="M21 44 Q30 53 39 44" stroke="#14213D" stroke-width="2.2" stroke-linecap="round" fill="none"/>
          `;
        }

        return `
          <svg width="${size}" height="${(size * 80) / 76}" viewBox="-6 0 76 80" fill="none" xmlns="http://www.w3.org/2000/svg">
            ${armSvg}
            <rect x="22" y="2" width="16" height="14" rx="5" fill="#F5A524"/>
            <rect x="4" y="12" width="52" height="56" rx="16" fill="${bodyColor}"/>
            <rect x="11" y="21" width="38" height="34" rx="10" fill="${faceColor}"/>
            <circle cx="16" cy="46" r="3" fill="#F5A524" opacity="0.45"/>
            <circle cx="44" cy="46" r="3" fill="#F5A524" opacity="0.45"/>
            ${faceFeaturesSvg}
            <rect x="8" y="72" width="44" height="4" rx="2" fill="#000000" opacity="0.18"/>
            ${shieldSvg}
            ${badgeSvg}
          </svg>
        `;
      },
      renderStudentDoodle: () => `
        <svg width="180" height="120" viewBox="0 0 118 84" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 78 H114" stroke="#9DB8FF" stroke-width="2"/>
          <path d="M14 56 Q30 40 52 46" stroke="#3D6BEA" stroke-width="2" stroke-dasharray="3 3" fill="none"/>
          <path d="M62 10 L106 24 L84 44 L78 34 Z" fill="#ffffff" stroke="#14213D" stroke-width="2"/>
          <path d="M62 10 L84 44" stroke="#14213D" stroke-width="1.5"/>
          <circle cx="34" cy="30" r="10" fill="#3D6BEA"/>
          <circle cx="34" cy="30" r="7" fill="#ffffff"/>
          <rect x="22" y="42" width="24" height="34" rx="8" fill="#14213D"/>
          <rect x="14" y="46" width="10" height="22" rx="4" fill="#F5A524"/>
          <path d="M30 46 Q48 44 60 22" stroke="#14213D" stroke-width="4.5" stroke-linecap="round" fill="none"/>
          <circle cx="86" cy="68" r="5" fill="#F5A524" stroke="#14213D" stroke-width="1.5"/>
        </svg>
      `,
      renderRadialAttackMap: () => `
        <svg viewBox="0 0 340 290" width="340" height="290" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="170" cy="145" r="130" fill="#1F3FA8" opacity="0.25"/>
          <circle cx="170" cy="145" r="104" stroke="#3D6BEA" stroke-width="1.5"/>
          <circle cx="170" cy="145" r="76" stroke="#3D6BEA" stroke-width="1.5"/>
          <circle cx="170" cy="145" r="48" stroke="#3D6BEA" stroke-width="1.5"/>
          <circle cx="170" cy="145" r="28" fill="#0A1440" stroke="#3D6BEA" stroke-width="1.5"/>
          <text x="170" y="151" text-anchor="middle" font-size="30" fill="#FFFFFF" font-weight="300">0</text>
          <text x="170" y="166" text-anchor="middle" font-size="9" fill="#AFC4FF">Funds lost</text>
        </svg>
      `
    };

    // Populate Chop Gallery
    const chops = [
      { exp: "wave", label: "Wave (Greeting)", body: "#3D6BEA", face: "#FFFFFF", bg: "blue-bg" },
      { exp: "idle", label: "Idle (Ready)", body: "#3D6BEA", face: "#FFFFFF", bg: "" },
      { exp: "guard", label: "Guard (Protected)", body: "#3D6BEA", face: "#FFFFFF", shield: true, bg: "" },
      { exp: "block", label: "Block (Attack Stopped)", body: "#3D6BEA", face: "#FFFFFF", bg: "" },
      { exp: "paused", label: "Paused (Kill switch)", body: "#9DB8FF", face: "#FFFFFF", bg: "" }
    ];

    const chopGalleryEl = document.getElementById('chop-gallery');
    chops.forEach(c => {
      const card = document.createElement('div');
      card.className = `chop-card ${c.bg}`;
      card.innerHTML = `
        ${uiArt.renderChopMascot({ expression: c.exp, bodyColor: c.body, faceColor: c.face, size: 56, showShield: c.shield })}
        <span class="chop-label">${c.label}</span>
      `;
      chopGalleryEl.appendChild(card);
    });

    document.getElementById('doodle-container').innerHTML = uiArt.renderStudentDoodle();
    document.getElementById('radial-container').innerHTML = uiArt.renderRadialAttackMap();
  </script>
</body>
</html>
