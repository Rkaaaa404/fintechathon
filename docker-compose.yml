services:
  bank:
    build:
      context: .
      dockerfile: backend/bank/Dockerfile
    ports:
      - "127.0.0.1:8100:8100"
    environment:
      - BANK_PORT=8100
      - BANK_HOST=0.0.0.0
      - BANK_DATA_DIR=/app/data/bank
      - BANK_SECRET_KEY=${BANK_SECRET_KEY:?Set BANK_SECRET_KEY to a random signing secret}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/v1/health')"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/api/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      bank:
        condition: service_healthy
    environment:
      - API_PORT=8000
      - API_HOST=0.0.0.0
      - API_DEMO_AUTH_ENABLED=true
      - API_DATA_DIR=/app/data/api
      - API_SECRET_KEY=${API_SECRET_KEY:?Set API_SECRET_KEY to a distinct random signing secret}
      - BANK_SERVICE_URL=http://bank:8100
      - BANK_SECRET_KEY=${BANK_SECRET_KEY:?Set BANK_SECRET_KEY to a random signing secret}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health')"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      api:
        condition: service_healthy
