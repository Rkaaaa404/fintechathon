services:
  bank:
    build:
      context: .
      dockerfile: backend/bank/Dockerfile
    ports:
      - "8100:8100"
    environment:
      - BANK_PORT=8100
      - BANK_HOST=0.0.0.0
      - BANK_DB_PATH=/app/backend/bank/aegispath_bank.db
      - BANK_SECRET_KEY=dev_shared_secret_hmac_bank_2026
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/v1/health')"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/api/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      bank:
        condition: service_healthy
    environment:
      - API_PORT=8000
      - API_HOST=0.0.0.0
      - API_DB_PATH=/app/backend/api/aegispath_api.db
      - BANK_SERVICE_URL=http://bank:8100
      - BANK_SECRET_KEY=dev_shared_secret_hmac_bank_2026
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health')"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
