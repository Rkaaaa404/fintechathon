services:
  bank:
    build:
      context: .
      dockerfile: backend/bank/Dockerfile
    ports:
      - "127.0.0.1:8100:8100"
    environment:
      - BANK_PORT=8100
      - BANK_HOST=0.0.0.0
      - BANK_DATA_DIR=/app/data
      - BANK_DATABASE_URL=sqlite:////app/data/bank.db
      - BANK_SECRET_KEY=${BANK_SECRET_KEY:?Set BANK_SECRET_KEY to a random signing secret}
    volumes:
      - aegispath_bank_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/v1/health')"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/api/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      bank:
        condition: service_healthy
    environment:
      - API_PORT=8000
      - API_HOST=0.0.0.0
      - API_DEMO_AUTH_ENABLED=true
      - API_DATA_DIR=/app/data
      - API_SECRET_KEY=${API_SECRET_KEY:?Set API_SECRET_KEY to a distinct random signing secret}
      - BANK_SERVICE_URL=http://bank:8100
      - BANK_SECRET_KEY=${BANK_SECRET_KEY:?Set BANK_SECRET_KEY to a random signing secret}
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.8-flash}
      - GROQ=${GROQ:-}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-20b}
    volumes:
      - aegispath_api_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health')"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost:8000
      - API_INTERNAL_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy

volumes:
  aegispath_api_data:
  aegispath_bank_data:
