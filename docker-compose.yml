services:
  bank:
    build:
      context: .
      dockerfile: backend/bank/Dockerfile
    ports:
      - "8100:8100"
    environment:
      - BANK_PORT=8100
      - BANK_HOST=0.0.0.0
      - BANK_DATA_DIR=/app/data
      - BANK_DATABASE_URL=sqlite:////app/data/bank.db
      - BANK_SECRET_KEY=${BANK_SECRET_KEY:-aegispath_bank_secret_key_2026_super_secure_isolated_token_v1}
    volumes:
      - aegispath_bank_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/v1/health')"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/api/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      bank:
        condition: service_healthy
    environment:
      - API_PORT=8000
      - API_HOST=0.0.0.0
      - API_DEMO_AUTH_ENABLED=true
      - API_DATA_DIR=/app/data
      - API_DATABASE_URL=sqlite:////app/data/api.db
      - API_SECRET_KEY=${API_SECRET_KEY:-aegispath_api_secret_key_2026_super_secure_production_token_v1}
      - BANK_SERVICE_URL=http://bank:8100
      - BANK_SECRET_KEY=${BANK_SECRET_KEY:-aegispath_bank_secret_key_2026_super_secure_isolated_token_v1}
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - aegispath_api_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health')"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost:8000
      - API_INTERNAL_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy

volumes:
  aegispath_api_data:
  aegispath_bank_data:
